<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- L'app gère elle-même son thème sombre : ce signal, disponible avant le
         CSS, empêche l'assombrissement automatique des navigateurs mobiles
         (Chrome « Auto dark theme », Samsung Internet) qui vire l'ambre en brun
         et rend les masques opaques. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" type="image/png" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-512.png" />
    <meta
      name="description"
      content="Entraînement et mémorisation active du répertoire de choros : partition à trous, session entrelacée et répétition espacée."
    />
    <title>Choros — entraînement</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
