name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # Parcours utilisateur déclaratifs (Playwright) — issue #17, phase 3.
  # Non bloquant (absent de la protection de branche `main`) tant que
  # seuls 2 des 6 flux prévus existent.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - name: Installer les dépendances (web)
        working-directory: web
        run: npm ci
      - name: Installer les dépendances (e2e)
        working-directory: e2e
        run: npm ci
      - name: Installer Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        working-directory: e2e
        run: npm run typecheck
      - name: Lancer les parcours
        working-directory: e2e
        env:
          CI: true
        run: npm test
      - name: Uploader le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
